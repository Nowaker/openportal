<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1c1d22"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>OpenCode Portal</title>
    <link rel="stylesheet" href="/src/main.css" />
    <script>
      // Asset-load recovery. When a hashed /assets/*-<hash>.{js,css} fails
      // to load, the cached HTML in this tab references a build the server
      // no longer has on disk - server shipped a new build and the old
      // hash is gone, or we're mid-deploy and the file briefly vanished.
      // Capped at 3 reload attempts via localStorage so a genuinely broken
      // deploy doesn't loop the browser forever. Two bugs the previous
      // version had:
      //
      //   1) After hitting MAX we did localStorage.removeItem(KEY) and
      //      replaced document.body.innerHTML. The listener was still
      //      registered, the counter was zeroed, and the NEXT asset
      //      failure (very common - browsers fail many parallel chunk
      //      requests after a deploy) started a fresh count-up and
      //      triggered another reload. Visible symptom: 'weird loops on
      //      the error screen'.
      //
      //   2) document.body.innerHTML wipeout destroyed the actual React
      //      error UI that the user wants to read. They could see 'asset
      //      failed' but not WHY the underlying app was broken.
      //
      // Fix: on MAX, set an in-memory 'stopped' flag (never reset until
      // page reload), keep the localStorage counter (so reloads triggered
      // by a different tab also see MAX), and APPEND a fixed-position
      // banner rather than replacing the document. The React app, error
      // boundary, and DevTools-visible stack trace remain underneath.
      (function () {
        var KEY = "openportal-asset-reload-count";
        var MAX = 3;
        var BANNER_ID = "__openportal-asset-banner";
        var stopped = false;
        window.__resetAssetReloadCounter = function () {
          try { localStorage.removeItem(KEY); } catch (e) {}
          stopped = false;
          var b = document.getElementById(BANNER_ID);
          if (b) b.remove();
        };
        function showBanner() {
          if (document.getElementById(BANNER_ID)) return;
          var banner = document.createElement("div");
          banner.id = BANNER_ID;
          banner.style.cssText =
            "position:fixed;top:0;left:0;right:0;z-index:99999;" +
            "padding:0.75rem 1rem;background:#dc2626;color:white;" +
            "font-family:system-ui,sans-serif;font-size:0.9rem;" +
            "display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;" +
            "box-shadow:0 2px 8px rgba(0,0,0,0.4)";
          var msg = document.createElement("span");
          msg.style.cssText = "flex:1;min-width:200px";
          msg.innerHTML =
            "<strong>OpenPortal:</strong> Failed to load assets after " + MAX +
            " attempts. The app below may show its own error - that's the actual cause. Reload once the underlying issue is fixed.";
          var reloadBtn = document.createElement("button");
          reloadBtn.textContent = "Reload now";
          reloadBtn.style.cssText =
            "padding:0.35rem 0.85rem;border:1px solid white;background:transparent;" +
            "color:white;cursor:pointer;border-radius:0.25rem;font-size:0.85rem";
          reloadBtn.onclick = function () {
            try { localStorage.removeItem(KEY); } catch (e) {}
            location.reload();
          };
          var dismissBtn = document.createElement("button");
          dismissBtn.textContent = "Dismiss";
          dismissBtn.style.cssText =
            "padding:0.35rem 0.85rem;border:1px solid rgba(255,255,255,0.4);" +
            "background:transparent;color:white;cursor:pointer;" +
            "border-radius:0.25rem;font-size:0.85rem";
          dismissBtn.onclick = function () { banner.remove(); };
          banner.appendChild(msg);
          banner.appendChild(reloadBtn);
          banner.appendChild(dismissBtn);
          function attach() {
            if (document.body) document.body.appendChild(banner);
            else setTimeout(attach, 50);
          }
          attach();
        }
        window.addEventListener(
          "error",
          function (e) {
            if (stopped) return;
            var t = e.target;
            if (!t) return;
            var url = t.src || t.href;
            if (typeof url !== "string") return;
            if (url.indexOf("/assets/") === -1) return;
            var count = 0;
            try { count = parseInt(localStorage.getItem(KEY) || "0", 10) || 0; } catch (e2) {}
            if (count >= MAX) {
              stopped = true;
              showBanner();
              return;
            }
            try { localStorage.setItem(KEY, String(count + 1)); } catch (e4) {}
            console.warn("[openportal] asset failed (attempt " + (count + 1) + "/" + MAX + "):", url);
            setTimeout(function () { window.location.reload(); }, 200);
          },
          true,
        );
        setTimeout(function () {
          try { localStorage.removeItem(KEY); } catch (e) {}
        }, 30000);
      })();
    </script>
    <script>
      (function () {
        const storageKey = "intentui-theme";
        const theme = localStorage.getItem(storageKey);
        const systemDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        if (
          theme === "dark" ||
          (theme === "system" && systemDark) ||
          (!theme && systemDark)
        ) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <div id="root"></div>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
