<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1c1d22"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>OpenCode Portal</title>
    <link rel="stylesheet" href="/src/main.css" />
    <script>
      // Asset-load recovery: when a hashed asset (/assets/*-<hash>.js or .css)
      // fails to load, the cached HTML in this tab references a build that
      // the server no longer has on disk. Either the server already shipped
      // a new build and the old hash is gone, or we're mid-deploy and the
      // file briefly vanished. Either way, the right move is to reload the
      // page so the browser re-fetches a fresh index.html with the current
      // build's hashes. Capped at 3 attempts via localStorage so a genuinely
      // broken deploy doesn't loop the browser forever. Counter is cleared
      // after the app finishes booting (resetReloadCounter() called from
      // main.tsx) and after 30 seconds as a fallback. Listener registered
      // here, BEFORE the module script tag, so it catches even the failure
      // to load main.tsx itself.
      (function () {
        var KEY = "openportal-asset-reload-count";
        var MAX = 3;
        window.__resetAssetReloadCounter = function () {
          try { localStorage.removeItem(KEY); } catch (e) {}
        };
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (!t) return;
            var url = t.src || t.href;
            if (typeof url !== "string") return;
            if (url.indexOf("/assets/") === -1) return;
            var count = 0;
            try { count = parseInt(localStorage.getItem(KEY) || "0", 10) || 0; } catch (e2) {}
            if (count >= MAX) {
              try { localStorage.removeItem(KEY); } catch (e3) {}
              document.body.innerHTML =
                "<div style='padding:1rem;font-family:system-ui'>" +
                "<h1>OpenPortal failed to load assets after " + MAX + " attempts.</h1>" +
                "<p>This usually means a deploy is in progress or the server lost the build directory.</p>" +
                "<p><a href='javascript:location.reload()'>Try again</a></p>" +
                "</div>";
              return;
            }
            try { localStorage.setItem(KEY, String(count + 1)); } catch (e4) {}
            console.warn("[openportal] asset failed (attempt " + (count + 1) + "/" + MAX + "):", url);
            setTimeout(function () { window.location.reload(); }, 200);
          },
          true,
        );
        setTimeout(function () {
          try { localStorage.removeItem(KEY); } catch (e) {}
        }, 30000);
      })();
    </script>
    <script>
      (function () {
        const storageKey = "intentui-theme";
        const theme = localStorage.getItem(storageKey);
        const systemDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        if (
          theme === "dark" ||
          (theme === "system" && systemDark) ||
          (!theme && systemDark)
        ) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <div id="root"></div>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
